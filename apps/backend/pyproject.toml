[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "m-assistant-backend"
version = "0.1.0"
description = "m_assistant backend (FastAPI WS gateway)"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "structlog>=24.1",
  "prometheus-client>=0.20",
  "httpx>=0.27",
  "tenacity>=8.2",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
]

[project.optional-dependencies]
# Keep STT heavy deps optional so tests/CI stay light.
stt = [
  "faster-whisper>=1.0.3",
]
memory = [
  "fastembed>=0.3.0",
  "hnswlib>=0.8.0",
]
wake = [
  "pvporcupine>=3.0.0",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
